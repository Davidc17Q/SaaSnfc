<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar · NFCloud</title>
  <meta name="theme-color" content="#141312" />
  <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.remove('dark')}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/icons.js"></script>
</head>
<body class="min-h-screen">
  <div class="login-split">

    <!-- Hero / Branding -->
    <aside class="login-hero">
      <svg class="login-hero-rings" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.5" aria-hidden="true">
        <circle cx="100" cy="100" r="88" /><circle cx="100" cy="100" r="88" /><circle cx="100" cy="100" r="88" /><circle cx="100" cy="100" r="88" />
      </svg>
      <div class="login-hero-content">
        <div class="login-brand">
          <img src="/logo-horizontal-blanco.png" alt="NFCloud" width="624" height="186" class="login-logo-full" />
        </div>
        <h1 class="login-hero-title">Cada punto físico de tu negocio, medido y bajo control</h1>
        <p class="login-hero-desc">
          Cambia el destino de tus puntos NFC y QR sin reimprimir, mira cómo se mueve cada sede
          y recibe un aviso cuando algo deja de funcionar.
        </p>
      </div>
    </aside>

    <!-- Formulario -->
    <main class="login-form-side">
      <form id="loginForm" class="login-card" novalidate>
        <!-- Marca compacta visible en móvil -->
        <div class="login-brand login-brand-mobile">
          <img src="/logo-texto-oscuro.png" alt="NFCloud" class="login-logo-full login-logo-full-dark" />
          <img src="/logo-texto-blanco.png" alt="NFCloud" class="login-logo-full login-logo-full-light" />
        </div>

        <h2 class="text-xl font-bold" style="margin-bottom:0.25rem">Iniciar sesión</h2>
        <p class="text-sm text-slate-500" style="margin-bottom:1.5rem">Entra a tu panel de NFCloud</p>

        <label for="user" class="block text-sm font-medium mb-1">Usuario</label>
        <div class="field">
          <span class="field-icon" data-icon="user"></span>
          <input id="user" type="text" class="field-input" autocomplete="username" placeholder="Tu usuario" autofocus />
        </div>

        <label for="password" class="block text-sm font-medium mb-1 mt-4">Contraseña</label>
        <div class="field">
          <span class="field-icon" data-icon="lock"></span>
          <input id="password" type="password" class="field-input" autocomplete="current-password" placeholder="Tu contraseña" />
          <button type="button" id="togglePw" class="field-toggle" title="Mostrar u ocultar" aria-label="Mostrar u ocultar la contraseña" data-icon="eye"></button>
        </div>

        <label class="remember">
          <input type="checkbox" id="remember" checked />
          <span class="remember-box"></span>
          <span class="text-sm">Recordar mi sesión</span>
        </label>

        <button id="loginBtn" type="submit" class="btn-login">Ingresar</button>
        <p id="loginMsg" role="alert" class="text-sm" style="margin-top:0.85rem;min-height:1.2rem"></p>
      </form>
    </main>

  </div>
  <script src="/login.js"></script>
</body>
</html>
